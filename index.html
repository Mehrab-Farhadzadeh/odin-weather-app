<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Weather App</title>
   <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script>
</head>

<body>


   <form action="">
      <p>
         <label for="location">Location:</label>
         <input type="text" name="location" id="location">
         <select name="units" id="units">
            <option value="centigrade">°C</option>
            <option value="fahrenheit">°F</option>
         </select>
         <input type="submit" value="Search">
      </p>
   </form>

   <output>
      <p>City: Temperature Condition</p>
      <p>
         <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExMWdyYWxhZmZta3Y1Z252ZnBxZGpteW41ZXVjb29vYTJtcDhleTV1MyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OSuaE6AknuRc7syZXp/giphy.gif" alt="Weather">
      </p>
   </output>


</body>

</html>
